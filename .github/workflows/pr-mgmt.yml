name: PR Lifecycle Management
on:
    pull_request:
        types: [opened, reopened, ready_for_review, converted_to_draft, closed]
    pull_request_review:
        types: [submitted]

jobs:
    manage-pr-state:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            issues: write
        steps:
            - uses: actions/checkout@v4
            - name: Update PR Status Labels
              uses: actions/github-script@v7
              with:
                  script: |
                      const script = require('./.github/scripts/pr-mgmt.js');
                      await script({ github, context, core });
