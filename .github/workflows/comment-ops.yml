name: Comment Operations
on:
    issue_comment:
        types: [created]

jobs:
    assign-from-comment:
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - uses: actions/checkout@v4
            - name: Process Commands
              uses: actions/github-script@v7
              if: contains(github.event.comment.body, '/assign') || contains(github.event.comment.body, 'ASSIGN_TO_ME')
              with:
                  script: |
                      const script = require('./.github/scripts/comment-ops.js');
                      await script({ github, context, core });
